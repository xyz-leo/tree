# Production: runs on the VPS behind Caddy, on Caddy's Docker network.
# No ports are published; Caddy proxies to tree:80.
#
#   cp docker/.env.example docker/.env   # then fill it in
#   docker compose -f docker/compose.yml up -d --build

services:
  tree:
    build:
      context: ../tree
      dockerfile: ../docker/Dockerfile
    image: tree:latest
    container_name: tree
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/rails/storage   # SQLite database
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - caddy

volumes:
  storage:

networks:
  caddy:
    name: ${CADDY_NETWORK:-caddy}
    external: true
